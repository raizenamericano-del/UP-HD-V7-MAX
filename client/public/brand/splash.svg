    <radialGradient id="spglowa" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spglowb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5f" stop-opacity="0.22"/>
